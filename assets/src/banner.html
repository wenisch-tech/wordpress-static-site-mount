<!doctype html><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0}
body{width:1544px;height:500px;overflow:hidden;font-family:"Open Sans","Noto Sans","Liberation Sans",sans-serif;color:#fff;position:relative;
background:radial-gradient(800px 520px at 82% 30%,#3a54d8 0%,rgba(58,84,216,0) 62%),linear-gradient(120deg,#0d1546 0%,#182a86 55%,#1f3fb0 100%)}
.left{position:absolute;left:72px;top:70px;width:540px}
.brand{display:flex;align-items:center;gap:26px}
.brand img{width:112px;height:112px;border-radius:26px;box-shadow:0 12px 34px rgba(0,0,0,.35)}
h1{font-size:62px;line-height:1.02;font-weight:800;letter-spacing:-1px}
.tag{margin-top:38px;font-size:36px;line-height:1.3;color:#fff;font-weight:700}
.sub{margin-top:24px;font-size:24px;line-height:1.4;color:#b4c0f5}

/* the diagram */
.stack{position:absolute;left:800px;top:46px;width:670px}
.band{border-radius:18px;display:flex;align-items:center;padding:0 24px;position:relative}
.theme{height:76px;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.28);font-size:20px;font-weight:700;color:#dfe5ff;gap:14px}
.theme .lg{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.8)}
.theme .nav{margin-left:auto;display:flex;gap:12px}
.theme .nav i{width:56px;height:11px;border-radius:6px;background:rgba(255,255,255,.55)}
.tag-l{position:absolute;right:20px;top:-14px;font-size:14px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;background:#2a3fa3;border:2px solid rgba(255,255,255,.35);border-radius:20px;padding:3px 12px;color:#e3e8ff}
.page{margin:18px 0;height:228px;background:#f7f8fd;color:#1b2140;border-radius:18px;padding:0;overflow:hidden;box-shadow:0 0 0 4px rgba(52,196,106,.9),0 24px 60px rgba(0,0,0,.4);display:flex;position:relative}
.page .side{width:170px;border-right:1px solid #e3e7f4;padding:56px 20px 22px;font-size:16px;color:#4b5580;display:flex;flex-direction:column;gap:12px}
.page .side u{text-decoration:none;color:#2c55d6;font-weight:800}
.page .main{flex:1;padding:22px 28px}
.page h2{font-size:28px;margin-bottom:12px}
.ln{height:11px;border-radius:6px;background:#dde2f2;margin:11px 0}
.ribbon{position:absolute;left:-2px;top:-2px;background:#34c46a;color:#04301a;font-weight:800;font-size:17px;padding:7px 16px 7px 14px;border-radius:16px 0 14px 0;letter-spacing:.2px;z-index:2}
.foot{height:76px;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.28)}
.foot .cols{display:flex;gap:70px}
.foot .cols div{display:flex;flex-direction:column;gap:9px}
.foot .cols i{display:block;height:11px;border-radius:6px;background:rgba(255,255,255,.55)}
.foot .cols i+i{height:8px;background:rgba(255,255,255,.3);width:70%}
/* arrow from the build into the page */
.build{position:absolute;left:636px;top:210px;width:150px;display:flex;align-items:center;gap:0;z-index:3}
.build .zip{background:#fff;color:#1b2140;font-weight:800;font-size:19px;padding:10px 16px;border-radius:12px;box-shadow:0 10px 26px rgba(0,0,0,.4);white-space:nowrap}
.build svg{margin-left:-4px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.35))}
</style>
<div class="left">
 <div class="brand"><img src="../icon-static-512x512.png"><h1>Static Site<br>Mount</h1></div>
 <div class="tag">Mount static HTML files in your existing WordPress site.</div>
 <div class="sub">Any static site, shown inside your theme, between its header and footer.</div>
</div>
<div class="build"><div class="zip">build.zip</div>
 <svg width="104" height="40" viewBox="0 0 104 40"><path d="M2 20h88M78 6l16 14-16 14" fill="none" stroke="#34c46a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<div class="stack">
 <div class="band theme"><span class="lg"></span>Your site<div class="nav"><i></i><i></i><i></i></div><span class="tag-l">Theme header</span></div>
 <div class="page"><span class="ribbon">Your static HTML goes here</span>
  <div class="side"><u>Introduction</u><span>Install</span><span>Configure</span><span>Deploy</span></div>
  <div class="main" style="padding-top:56px"><h2>Introduction</h2><div class="ln" style="width:94%"></div><div class="ln" style="width:80%"></div><div class="ln" style="width:88%"></div></div>
 </div>
 <div class="band theme foot"><div class="cols"><div><i style="width:80px"></i><i></i></div><div><i style="width:60px"></i><i></i></div><div><i style="width:70px"></i><i></i></div></div><span class="tag-l" style="top:auto;bottom:-14px">Theme footer</span></div>
</div>
